<html> 
<body> 

<script type="text/javascript"> 
  // Declaración e inicialización de variables numéricas y de texto
  var a = 33; 
  var b = 10; 
  var c = "Test"; 
  var linebreak = "<br />"; // Variable para insertar un salto de línea en el HTML

  // SUMA: Suma dos valores numéricos (33 + 10 = 43)
  document.write("a + b = "); 
  result = a + b; 
  document.write(result); 
  document.write(linebreak); 

  // RESTA: Resta b a a (33 - 10 = 23)
  document.write("a - b = "); 
  result = a - b; 
  document.write(result); 
  document.write(linebreak); 

  // DIVISIÓN: Divide a entre b (33 / 10 = 3.3)
  document.write("a / b = "); 
  result = a / b; 
  document.write(result); 
  document.write(linebreak); 

  // MÓDULO: Muestra el resto de la división entera entre 33 y 10 (33 % 10 = 3)
  document.write("a % b = "); 
  result = a % b; 
  document.write(result); 
  document.write(linebreak); 

  // CONCATENACIÓN: Al incluir la cadena "Test", los números se concatenan como texto ("43Test")
  document.write("a + b + c = "); 
  result = a + b + c; 
  document.write(result); 
  document.write(linebreak); 

  // INCREMENTO (Post-incremento): 
  // Ojo: 'result = a++' asigna primero el valor actual de 'a' a 'result' y LUEGO incrementa 'a'.
  document.write("a++ = "); 
  result = a++; 
  document.write(result); 
  document.write(linebreak); 

  // DECREMENTO (Post-decremento): 
  // Asigna primero el valor actual de 'b' a 'result' y LUEGO decrementa 'b'.
  document.write("b-- = "); 
  result = b--; 
  document.write(result); 
  document.write(linebreak); 
</script> 

<p>Set the variables to different values and then try...</p> 
</body> 
</html>
