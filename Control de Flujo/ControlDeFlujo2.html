<script type="text/javascript"> 
  // Declaramos la variable 'age' con el valor 15
  var age = 15; 
 
  // Verificamos si la edad es mayor a 18
  if (age > 18) { 
     // Si la condición se cumple (es mayor a 18), muestra este mensaje
     document.write("<b>Qualifies for driving</b>"); 
  } else { 
     // Si la condición NO se cumple (es igual o menor a 18), muestra este mensaje
     document.write("<b>Does not qualify for driving</b>"); 
  }
</script>
