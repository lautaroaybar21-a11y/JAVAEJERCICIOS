<html> 
<body> 

<script type="text/javascript"> 
  // Declaración de variables numéricas y etiqueta de salto de línea
  var a = 10; 
  var b = 20; 
  var linebreak = "<br />"; 

  // IGUALDAD (==): Evalúa si 'a' es igual a 'b' (10 == 20 es false)
  document.write("(a == b) => "); 
  result = (a == b); 
  document.write(result); 
  document.write(linebreak);

  // MENOR QUE (<): Evalúa si 'a' es estrictamente menor que 'b' (10 < 20 es true)
  document.write("(a < b) => "); 
  result = (a < b); 
  document.write(result); 
  document.write(linebreak); 

  // MAYOR QUE (>): Evalúa si 'a' es estrictamente mayor que 'b' (10 > 20 es false)
  document.write("(a > b) => "); 
  result = (a > b); 
  document.write(result); 
  document.write(linebreak); 

  // DESIGUALDAD / DISTINTO (!=): Evalúa si 'a' es diferente de 'b' (10 != 20 es true)
  document.write("(a != b) => "); 
  result = (a != b); 
  document.write(result); 
  document.write(linebreak); 

  // MAYOR O IGUAL QUE (>=): Evalúa si 'a' es mayor o igual a 'b' (10 >= 20 es false)
  document.write("(a >= b) => "); 
  result = (a >= b); 
  document.write(result); 
  document.write(linebreak); 

  // MENOR O IGUAL QUE (<=): Evalúa si 'a' es menor o igual a 'b' (10 <= 20 es true)
  document.write("(a <= b) => "); 
  result = (a <= b); 
  document.write(result); 
  document.write(linebreak); 
</script> 

<p>Set the variables to different values and different operators and then try...</p> 
</body> 
</html>
